services:
  - type: web
    name: legends-rpg
    runtime: static
    buildCommand: npm ci && npm run export:web
    staticPublishPath: ./dist-web
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
    headers:
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
